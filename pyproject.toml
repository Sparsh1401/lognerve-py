[project]
name = "lognerve-py"
version = "0.1.0"
description = "Python SDK for tracing LLM and agent applications with LogNerve"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "ISC" }
dependencies = [
  "opentelemetry-api>=1.24,<2.0",
  "opentelemetry-sdk>=1.24,<2.0",
  "opentelemetry-exporter-otlp-proto-http>=1.24,<2.0",
  "openinference-instrumentation>=0.1.20,<1.0",
]

[project.optional-dependencies]
instrumentations = [
  "openinference-instrumentation-openai>=0.1.20,<1.0",
  "openinference-instrumentation-anthropic>=0.1.0,<2.0",
  "openinference-instrumentation-langchain>=0.1.20,<1.0",
  "openinference-instrumentation-crewai>=1.0,<2.0",
  "openinference-instrumentation-autogen>=0.1.0,<1.0",
  "openinference-instrumentation-openai-agents>=0.1.0,<2.0",
  "openinference-instrumentation-claude-agent-sdk>=0.1.0,<2.0",
  "openinference-instrumentation-llama-index>=4.0,<5.0",
  "openinference-instrumentation-agno>=0.1.0,<1.0",
  "openinference-instrumentation-google-genai>=0.1.0,<1.0",
]
dev = ["pytest>=7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lognerve"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
